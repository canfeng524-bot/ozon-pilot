# ============================================================
# Ozon 上架流水线配置
# 提示词 / AI 模型 / 价格参数 全部在此修改，改完重跑 run.py 即生效
# ============================================================

paths:
  workspace: "E:\\ozon商品"        # 商品文件夹的父目录，每个商品一个子文件夹

# ---------- 货源图片质量门槛 ----------
# 小于此短边的图不能作为 Ozon 1350×1800 素材或 AI 参考，直接从素材池排除。
intake:
  min_image_short_side_px: 600

# ---------- 最终成品语言门槛 ----------
# 供应商详情页常把中文标题/段落烙在图片里。成品图只允许俄文程序叠字；
# 含中文的源图必须裁出纯商品区域、重制或留空，禁止整张直接进入 remastered/。
final_asset_policy:
  forbid_source_chinese_text: true
  overlay_language: "ru"
  supplier_text_action: "crop_rebuild_or_leave_empty"
  require_visual_qa: true

# ---------- 价格测算默认参数（审核页/XLSX 里可再调） ----------
pricing:
  buy_cost_cny: 118
  cny_to_rub: 12.5
  china_ru_shipping_rub: 650
  ozon_commission_pct: 18
  ozon_acquiring_pct: 1.5
  ozon_last_mile_rub: 110
  suggested_price_rub: 3990

# ---------- AI 环节配置 ----------
# 默认零配置：AI 在环模式（TRAE 会话内完成文案/看图筛选/GenerateImage 生图），本段全部忽略。
# 仅当需要无人值守批量时填写（走 OpenAI 兼容接口）：
models:
  # 俄语文案生成（标题/卖点/描述）
  copy:
    base_url: ""        # 例 https://api.deepseek.com/v1
    api_key: ""
    model: ""           # 例 deepseek-chat
  # 图片筛选与裁剪判定（需要视觉能力的模型）
  vision:
    base_url: ""        # 例 https://ark.cn-beijing.volces.com/api/v3
    api_key: ""
    model: ""           # 例 doubao-1.5-vision-pro-32k
  # AI 场景图生成（火山引擎 Seedream；TRAE 内生图已由 Seedream 插件驱动，无需填）
  # 版本性价比：seedream-4-0 为主力（~¥0.21/张，质量接近 4.5），3.0 草稿试构图，4.5 大促精修
  image:
    provider: "seedream"          # seedream | openai_compat
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    api_key: ""
    model: "doubao-seedream-4-0"
    size: "1350x1800"             # Ozon 3:4

# ---------- 文案提示词 ----------
prompts:
  copy_system: |
    你是 Ozon 俄罗斯电商平台的资深Listing优化师。基于给出的1688货源数据，产出可直接上架的俄语文案。
    标题规则（严格遵守）：
    1. 结构固定为「核心词 + 属性词 + 场景词」，总长 ≤200 字符。
    2. 核心词必须放最前（俄罗斯买家会实际输入的品类名 + 合适的人群/形态，如「сумка-ведро женская」「мини-сумка через плечо」）。搜索卡片只显示前50–60字符，前段必须能独立、自然、准确地表达商品；不得把场景词或营销词放在前段。
    3. 属性词放在中段，采用自然俄语名词短语，清楚写出已验证的材质、颜色、型号或核心功能；没有证据的属性一律不写。具体长宽高通常放入属性表、描述和尺寸图，不进入标题，除非类目或用户明确要求。可用一个常见同义检索词补充理解，但禁止重复堆砌「сумка、женская、кожаная」等词。
    4. 场景词放在末尾拉长尾，例如「на каждый день」「для прогулок」「в подарок」。只使用与商品实际适用人群、尺寸和用途一致的词；不得为了搜索覆盖给女包加入「для мужчин」，不得凭空加入「для дома、для работы、для учёбы」等场景。
    5. 不要逐字翻译中文标题，也不要照搬1688或竞品表达。标题必须像俄罗斯消费者会读懂、会搜索的自然俄语；优先使用俄语常见品类词、简洁逗号分隔属性和正确的介词短语。
    6. 先按俄罗斯买家的真实检索表达选择核心词和常用同义词，再写属性与场景。可参考当前 Ozon 站内用语、季节和临近节日，但只有同时满足“与商品真实匹配”和“有当期站内依据”才可使用；不得把未经搜索量验证的词宣称为高频热词。动态季节/节日词在标题中最多一个，过季后必须移除。不要把中文场景词逐字翻译，也不要为了覆盖搜索把「礼物、家用、通勤、约会」等全部塞入标题；每个词都必须适合当前商品。对女包优先考虑「сумка женская через плечо」「кросс-боди」「повседневная」等自然组合，但仅在款式和背法证据支持时使用。
    输出 JSON：title_ru(标题), title_ru_zh(中文对照), highlights_ru(5条卖点), highlights_zh(对照),
    description_ru(描述，含尺寸重量), description_zh(对照), attributes_ru(俄语属性表数组{name,value})。
    1688属性若与图片标注矛盾（如容量虚标），以尺寸计算为准并弃用虚假值。输出前逐项检查：标题、人群词、场景词、颜色、材质和功能均须与证据一致。
  copy_user: |
    货源数据：{data}

# ---------- 图片提示词（AI 生成环节） ----------
# 铁律：产品外观必须严格参考源图，禁止改变结构/颜色/细节；使用原创虚构成年模特；写实风不过度美颜。
# AI 只可用于“实际使用场景/上身效果”。侧背面、内里、容量、材质微距、配件结构、颜色集合等事实图，缺少对应实拍时一律留空。
# {product_desc} 会替换为具体产品的中文描述
image_prompts:
  main_scene: |
    Ozon 上架首图，实际使用场景：{product_desc}。俄罗斯日常街道或明亮通勤空间，成年模特以背影或侧影使用产品，不露出脸。
    产品必须逐项严格参考输入实拍：SKU颜色、轮廓、比例、纹理、五金、肩带及配件均不得改变、增减或美化；不确定的部位不展示。
    产品清晰占画面视觉中心，背景简洁，真实电商摄影，吸引但不夸张。生成图内不生成任何文字、logo、水印；仅可在成图后以程序叠加少量已验证俄语文字。
    输出 Ozon 竖图 3:4，1350×1800。
  main_scene_alt: |
    Ozon 首图备选，实际使用场景：{product_desc}。与首图不同的俄罗斯日常场景，成年模特仅背影或侧影，不露出脸。
    产品必须逐项严格参考输入实拍：SKU颜色、轮廓、比例、纹理、五金、肩带及配件均不得改变、增减或美化；不确定的部位不展示。
    产品清晰可见、背景克制、写实电商摄影。生成图内不生成任何文字、logo、水印；仅可在成图后以程序叠加少量已验证俄语文字。
    输出 Ozon 竖图 3:4，1350×1800。
  model_street: |
    副图1，上身效果：俄罗斯日常街道场景，原创虚构成年模特自然背/挎/手提这款包；不过度美颜，真实摄影质感。
    目的：让买家看清上身大小与版型，判断是否适合自己的身高体型。
    产品严格参考商品图，包身颜色与实拍一致，不美化不变形。写实风，不过度美颜，偏真实街拍质感。
  model_back: |
    副图2，上身效果：办公室、地铁通勤或咖啡馆等第二场景（与街道场景区分）。若已有 model1，必须使用同一虚构成年模特：保持脸部结构、年龄、体型、发型和肤色，只改变场景、服装与姿势。
    产品严格参考商品图，包色与实拍一致。写实风，不过度美颜。
  interior_capacity: |
    副图5，内部容量实测：白底或浅色简约桌面，当前 SKU 的包打开，以真实内部结构为准。
    仅展示已有证据支持的内胆袋、内袋、侧袋和扣具；放手机、迷你钱包、钥匙演示日常容量，但不得夸大尺寸或凭空增加拉链暗袋、隔层。
    产品颜色、轮廓、五金、内里和开口结构必须严格参考输入实拍。生成图内不得出现中文、俄文或任何文字、logo、水印；俄文说明由程序后期叠加。

# ---------- 副图槽位计划（可增删改）----------
# 上架规格：1 张实际首图 + 1 张首图备选 + 7 张副图。Ozon 列表只使用第一张首图；首图备选供审核替换。
# 缺素材的槽位宁缺毋滥，禁止编造。颜色合集仅在存在多个已确认 SKU 且每色有实拍时生成。
# type: real=真实素材合成 | ai=AI生成 | program=程序排版
# 图片铁律：只基于 source/ 真实图片裁剪拼合或严格参考生成，禁止想象产品；俄语文字一律程序排版
carousel_plan:
  - id: main
    role: "主图·实际使用场景：不露脸模特，产品清晰为视觉中心；严格参考当前 SKU 实拍"
    type: ai
    prompt_key: main_scene
  - id: main_alt
    role: "主图备选·第二个实际使用场景：用于审核替换，不与主图同时作为首图"
    type: ai
    prompt_key: main_scene_alt
  - id: model1
    role: "副图1·模特上身：俄罗斯日常场景（街道），背/挎/手提真实上身效果，偏写实不过度美颜，买家看上身大小版型"
    type: ai
    prompt_key: model_street
  - id: model2
    role: "副图2·模特上身：办公室/地铁等第二场景，与副图1场景区分，背影/侧影不露脸"
    type: ai
    prompt_key: model_back
  - id: angles
    role: "副图3·多角度白底实拍：纯白背景无模特，侧面厚度+背面（肩带结构/背面口袋），消除想象偏差"
    type: real
    picks_tags: [side, back]
    ru_label: ["Вид сбоку", "Вид сзади"]
  - id: material
    role: "副图4·材质做工特写：只用无中文的实拍裁切，展示纹理/车线/五金，俄语程序标注"
    type: real
    picks_tags: [material, detail]
    ru_label: ["Фактура натурального спилка", "Металлическая фурнитура и строчка"]
  - id: interior
    role: "副图5·内部收纳实测：白底/简约桌面，包打开，仅展示有证据的内胆/口袋，放手机、迷你钱包、钥匙演示容量"
    type: real
    picks_tags: [interior]
    ru_label: ["Съёмный внутренний мешок", "Телефон · мини-кошелёк · ключи"]
  - id: size_info
    role: "副图6·尺寸信息图：白底俄文信息图，标注Ширина/Высота/Глубина(cm)，只用普通手机约7.5×15cm作同尺度参照"
    type: program
    ru_label: ["Ширина", "Высота", "Глубина"]
  - id: strap
    role: "副图7·配件与细节功能：可调节肩带/锁扣/五金细节实拍，俄文保养提示，体现质感和调节范围"
    type: real
    picks_tags: [back, detail]
    ru_label: ["Цепочка через плечо", "Детали — по фото"]
  - id: color_set
    role: "可选副图8·颜色合集：仅对多个已确认 SKU 的实拍平铺，俄语标注颜色名称"
    type: real
    picks_tags: [color_set]
    optional: true
    requires_multiple_skus: true

# 图片输出规格
image_spec:
  width: 1350
  height: 1800
  font: "C:\\Windows\\Fonts\\arial.ttf"
